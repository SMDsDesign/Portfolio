<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shankar Majumdar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=League+Gothic&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Oswald:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Kaushan+Script&family=Allura&display=swap">
<style id="site-css">
/* Layout: athlete-poster stage — huge metallic name, gold brush script, slanted photo panels, stat columns, career strip. Black and gold throughout. */
:root{
  color-scheme:dark;
  --onyx:#0E0D0C;--gold:#C9A15A;
  --gold-hi:#E8C987;--bronze:#8A6A3E;--graphite:#1A1816;--steel:#2A2724;--smoke:#8C857B;--ivory:#F4F1EB;
  --line:rgba(201,161,90,.28);--line-soft:rgba(244,241,235,.1);
  --silver:linear-gradient(180deg,#FFFFFF 0%,#D9D6D0 38%,#8F8B85 52%,#C9C5BE 68%,#F2EFEA 100%);
  --goldgrad:linear-gradient(100deg,#9C7637 0%,#E8C987 38%,#C9A15A 62%,#F0D79C 100%);
  --f-display:"Anton","Oswald","Arial Narrow",Impact,sans-serif;
  --f-ui:"Oswald","Arial Narrow",sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-brush:"Kaushan Script","Brush Script MT",cursive;
  --f-sign:"Allura","Brush Script MT",cursive;
  --gutter:max(16px,env(safe-area-inset-left,0px));--gutter-r:max(16px,env(safe-area-inset-right,0px));
  --side:0px;
  --ease:cubic-bezier(.2,.7,.1,1);
}
@media (min-width:1100px){:root{--side:56px}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--onyx);color:var(--ivory);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--onyx)}
::selection{background:var(--gold);color:var(--onyx)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
img{max-width:100%;display:block}

/* type primitives */
.eyebrow{font-family:var(--f-ui);font-weight:500;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--ivory);display:inline-flex;align-items:center;gap:14px}
.eyebrow::after{content:"";width:46px;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,transparent 12px 17px)}
.label{font-family:var(--f-ui);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.metal{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.goldtxt{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brush{font-family:var(--f-brush);font-weight:400;text-transform:none;letter-spacing:0}
.muted{color:var(--smoke)}

/* reveal: transform/opacity only */
.js .rv{opacity:0;transform:translate3d(0,26px,0);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--d,0)*90ms)}
.js .rv.in{opacity:1;transform:none}

/* notched panel */
.notch{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.panel{position:relative;background:linear-gradient(160deg,rgba(201,161,90,.07),rgba(201,161,90,0) 60%),var(--graphite);border:1px solid var(--line)}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:24px;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gutter-r) 16px max(var(--gutter),calc(var(--side) + 20px));transition:background .4s,border-color .4s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(14,13,12,.94);border-color:var(--line-soft)}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:.02em;text-decoration:none;line-height:1}
.nav ul{display:flex;gap:clamp(18px,3vw,46px);list-style:none;margin:0 auto;padding:0}
.nav ul a{font-family:var(--f-ui);font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#D9D3C8;position:relative;padding-bottom:8px;transition:color .3s}
.nav ul a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav ul a:hover,.nav ul a.on{color:var(--ivory)}
.nav ul a:hover::after,.nav ul a.on::after{transform:none}
.burger{margin-left:auto;width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.burger span,.burger span::before,.burger span::after{display:block;width:24px;height:2px;background:var(--gold);position:relative;content:""}
.burger span::before{position:absolute;top:-7px}.burger span::after{position:absolute;top:7px}
@media (min-width:961px){.nav ul{margin:0 auto}.burger{margin-left:0}}
@media (max-width:960px){.nav ul{display:none}}
.menu{position:fixed;inset:0;z-index:70;background:rgba(14,13,12,.97);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s}
.menu.open{opacity:1;pointer-events:auto}
.menu nav{display:grid;gap:8px;text-align:center}
.menu a{font-family:var(--f-display);font-size:clamp(40px,8vw,72px);text-transform:uppercase;text-decoration:none;line-height:1.05}
.menu a:hover{color:var(--gold)}
.menu .x{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));width:44px;height:44px;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:22px;cursor:pointer}

/* side rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:56px;z-index:20;display:none;pointer-events:none}
@media (min-width:1100px){.rail{display:block}}
.rail .vt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-family:var(--f-ui);font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#BDB6AA}
.rail .bar{position:absolute;left:50%;top:96px;width:1px;height:90px;background:linear-gradient(var(--gold),transparent)}
.rail .idx{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-family:var(--f-display);font-size:20px;color:var(--gold)}

/* HERO */
.hero{position:relative;min-height:max(100svh,760px);overflow:hidden;background:radial-gradient(70% 70% at 52% 46%,#2A2218 0%,#14110E 45%,var(--onyx) 75%)}
.hero .streak{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,transparent 38%,rgba(201,161,90,.09) 46%,transparent 54%),linear-gradient(118deg,transparent 60%,rgba(201,161,90,.06) 64%,transparent 70%)}
.hero .lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slab{position:absolute;overflow:hidden;background:#000;will-change:transform}
.slab img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1) brightness(.62)}
.slab::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,13,12,.1),rgba(14,13,12,.75))}
.slab.a{top:0;right:14%;width:30%;height:62%;clip-path:polygon(22% 0,100% 0,78% 100%,0 100%)}
.slab.b{left:23%;bottom:13%;width:26%;height:40%;clip-path:polygon(16% 0,100% 0,84% 100%,0 100%);opacity:.85}
.hero-inner{position:relative;z-index:3;min-height:inherit;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr) minmax(220px,.42fr);grid-template-rows:1fr auto;column-gap:clamp(16px,2vw,32px);padding:calc(108px + env(safe-area-inset-top,0px)) var(--gutter-r) 0 max(var(--gutter),calc(var(--side) + 20px))}
.hero-copy{grid-column:1;grid-row:1;align-self:center;position:relative;z-index:4;padding-bottom:40px;min-width:0}
.hero-name{margin:22px 0 0;line-height:.86;font-weight:400}
.hero-name .big{display:block;font-family:var(--f-display);text-transform:uppercase;font-size:clamp(58px,9.2vw,156px);letter-spacing:.005em}
.hero-name .script{display:block;font-family:var(--f-brush);font-size:clamp(56px,7.6vw,128px);margin:-.38em 0 0 .32em;transform:rotate(-7deg);transform-origin:left;line-height:1.1;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55));padding-right:.2em}
.hero-quote{display:grid;grid-template-columns:34px 1fr;gap:10px 16px;margin-top:30px;max-width:380px}
.hero-quote .qm{font-family:var(--f-display);font-size:58px;line-height:.8;color:var(--gold)}
.hero-quote p{margin:0;font-family:var(--f-ui);font-size:15px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6}
.hero-quote p .g{color:var(--gold);display:block}
.cta{display:inline-flex;align-items:center;gap:18px;margin-top:34px;padding:15px 30px;border:1.5px solid var(--gold);background:transparent;color:var(--ivory);text-decoration:none;font-family:var(--f-ui);font-size:13px;letter-spacing:.16em;text-transform:uppercase;transform:skewX(-14deg);transition:background .35s,color .35s}
.cta>span{display:inline-flex;align-items:center;gap:18px;transform:skewX(14deg)}
.cta:hover{background:var(--gold);color:var(--onyx)}
.cta svg{width:22px;height:12px}
.sign{font-family:var(--f-sign);font-size:clamp(46px,4vw,66px);line-height:1;margin-top:26px;transform:rotate(-6deg);opacity:.9}
.hero-photo{grid-column:2;grid-row:1/3;position:relative;align-self:end;justify-self:center;width:min(100%,560px);z-index:2}
.hero-photo .glow{position:absolute;left:8%;right:8%;top:6%;bottom:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(201,161,90,.32),rgba(201,161,90,0));z-index:-1}
.hero-photo img{width:100%;height:auto}
.hero-side{grid-column:3;grid-row:1;align-self:center;position:relative;z-index:4;padding-bottom:30px;display:grid;gap:12px}
.about-mini{margin-bottom:10px}
.about-mini h3{margin:0 0 10px;font-family:var(--f-ui);font-weight:500;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.about-mini p{margin:0;font-size:14px;line-height:1.7;color:#CFC8BC;white-space:pre-line}
.loc{display:flex;align-items:center;gap:12px;margin-top:14px;font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.flag{width:24px;height:16px;background:linear-gradient(#FF9933 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%);position:relative;flex:none}
.flag::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;border:1px solid #000080}
.loc i{flex:1;height:1px;background:var(--line);position:relative}
.loc i::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.statbox{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:14px;padding:11px 16px;border:1px solid var(--line);background:rgba(14,13,12,.55)}
.statbox svg{width:30px;height:30px;color:var(--gold)}
.statbox b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,2.6vw,40px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.statbox span{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#D2CABD;margin-top:4px}
.strip{grid-column:1/-1;grid-row:2;position:relative;z-index:4;display:flex;align-items:stretch;gap:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line-soft);background:linear-gradient(0deg,rgba(14,13,12,.95),rgba(14,13,12,.6));margin-inline:calc(-1*var(--gutter-r)) calc(-1*var(--gutter-r))}
.strip::-webkit-scrollbar{display:none}
.club{flex:1 0 170px;display:flex;align-items:center;gap:12px;padding:18px 16px;position:relative}
.club+.club::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--line)}
.club .mono{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:var(--gold);letter-spacing:.04em}
.club b{display:block;font-family:var(--f-ui);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1.25}
.club small{display:block;font-size:11px;color:var(--smoke);letter-spacing:.06em}
.club.now .mono{background:var(--gold);color:var(--onyx)}
.strip .progress{position:absolute;left:0;bottom:0;height:2px;width:22%;background:var(--gold)}
.motto{position:absolute;right:var(--gutter-r);bottom:96px;z-index:4;width:min(240px,22vw);aspect-ratio:1;overflow:hidden;border:1px solid var(--line)}
.motto img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.55)}
.motto p{position:absolute;inset:auto 14px 14px;margin:0;font-family:var(--f-ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1.45;color:var(--ivory)}
.motto p b{color:var(--gold);font-weight:500}
@media (max-width:1280px),(max-height:1000px){.motto{display:none}}

/* hero entrance */
.js .hero .in-a{opacity:0;transform:translate3d(0,40px,0);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:calc(var(--d,0)*120ms + 150ms)}
.ready .hero .in-a{opacity:1;transform:none}
.js .hero-name .script{clip-path:inset(0 100% 0 0);transition:clip-path 1.3s var(--ease) .75s}
.ready .hero-name .script{clip-path:inset(-20% -10% -20% -5%)}
.js .hero-photo{opacity:0;transform:translate3d(6%,0,0);transition:opacity 1.2s var(--ease) .2s,transform 1.4s var(--ease) .2s}
.ready .hero-photo{opacity:1;transform:none}
.js .slab{opacity:0;transition:opacity 1.4s var(--ease) .4s}
.ready .slab{opacity:1}
.ready .slab.b{opacity:.85}

@media (max-width:1100px){
  .hero-inner{grid-template-columns:minmax(0,1fr) minmax(0,.9fr);grid-template-rows:auto auto auto}
  .hero-copy{grid-column:1}
  .hero-photo{grid-column:2;grid-row:1}
  .hero-side{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:24px}
  .hero-side .about-mini{grid-column:1/-1}
  .strip{grid-row:3}
  .slab.b{display:none}
}
@media (max-width:720px){
  .hero-inner{grid-template-columns:1fr}
  .hero-copy{padding-bottom:10px}
  .hero-photo{grid-column:1;grid-row:2;width:min(100%,420px)}
  .hero-side{grid-row:3;grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{grid-row:4}
  .slab.a{right:-10%;width:60%;height:40%}
}


/* ---------- home screen: navy poster, giant name behind the portrait ---------- */
.hx-wrap{position:relative;height:185svh;min-height:1150px;background:#050A1C}
.hx{--navy:#050A1C;--cream:#EADFCB;position:sticky;top:0;height:100svh;min-height:620px;overflow:hidden;background:radial-gradient(80% 70% at 55% 45%,#0B1430 0%,var(--navy) 70%);color:var(--cream)}
.hx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,var(--onyx));z-index:4;pointer-events:none}
.hx-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center 38%;pointer-events:none;will-change:opacity,transform}
.hx-bg.wolf{opacity:.42;mix-blend-mode:normal}
.hx-bg.lion{opacity:0;background-position:center 40%}
.hx-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 70% at 50% 45%,rgba(5,10,28,.15),rgba(5,10,28,.85))}
.hx-name{position:absolute;left:var(--hxg);right:var(--hxg);top:14.5%;margin:0;z-index:1;display:flex;justify-content:center;pointer-events:none}
.hx-name span{display:inline-block;font-family:"League Gothic","Anton","Arial Narrow",Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.8;letter-spacing:.005em;white-space:nowrap;color:var(--cream);transform-origin:50% 0;transform:scaleY(var(--sy,1));font-size:22vw}
.hx{--hxg:clamp(16px,2.6vw,40px)}
@media (prefers-reduced-motion:reduce){.hx-wrap{height:auto;min-height:0}.hx{position:relative}}
.hx-photo{position:absolute;left:50%;bottom:0;height:81%;z-index:2;transform:translateX(-46%)}
.hx-photo img{height:100%;width:auto;max-width:none;filter:contrast(1.06) saturate(.92)}
.hx-tl,.hx-tr{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));z-index:3;font-family:var(--f-ui);font-weight:400;font-size:clamp(11px,1vw,14px);letter-spacing:.28em;text-transform:uppercase;line-height:1.7;color:var(--cream)}
.hx-tl{left:var(--hxg)}
.hx-tr{right:var(--hxg);text-align:right}
.hx-mono{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:2px;color:var(--gold);padding:4px 10px}
.hx-mono b{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(34px,3.2vw,46px);line-height:1;letter-spacing:-.06em}
.hx-mono b i{font-style:italic;margin-left:-.08em}
.hx-mono small{font-family:var(--f-ui);font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:rgba(234,223,203,.6);padding-left:.4em}
.hx-bl{position:absolute;left:var(--hxg);bottom:clamp(40px,8vh,84px);z-index:5;margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(17px,1.75vw,26px);letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.hx-bl em{font-style:italic;color:var(--gold);text-transform:uppercase}
.hx-br{position:absolute;right:var(--hxg);bottom:clamp(40px,8vh,84px);z-index:5;max-width:min(300px,26vw);text-align:right}
.hx-br p{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(16px,1.35vw,20px);line-height:1.35;color:var(--cream)}
.hx-br .sig{display:block;margin-top:12px;font-family:var(--f-sign);font-size:clamp(28px,2.4vw,38px);line-height:1;color:var(--gold)}
/* entrance */
.js .hx-name span{clip-path:inset(100% 0 0 0);transition:clip-path 1.2s var(--ease) .15s}
.ready .hx-name span{clip-path:inset(-2% 0 -2% 0)}
.js .hx-photo{opacity:0;transform:translate(-46%,5%);transition:opacity 1.2s var(--ease) .45s,transform 1.4s var(--ease) .45s}
.ready .hx-photo{opacity:1;transform:translate(-46%,0)}
.js .hx .fade{opacity:0;transition:opacity 1s ease;transition-delay:calc(var(--d,0)*120ms + 900ms)}
.ready .hx .fade{opacity:1}
/* nav waits until you leave the home screen */
.at-top .nav{opacity:0;pointer-events:none;transform:translateY(-12px)}
.nav{transition:background .4s,border-color .4s,opacity .45s,transform .45s}
.at-top .rail{opacity:0}
.rail{transition:opacity .45s}
@media (max-width:760px){
  .hx{min-height:640px}
  .hx-name{top:17%}
  .hx-photo{height:66%}
  .hx-tl,.hx-tr{font-size:10px;letter-spacing:.2em;top:calc(64px + env(safe-area-inset-top,0px))}
  .hx-mono{top:calc(10px + env(safe-area-inset-top,0px))}
  .hx-bl{bottom:auto;top:calc(17% + var(--nameh,120px) + 14px);font-size:15px}
  .hx-br{display:none}
}

/* sections */
.sec{position:relative;overflow:hidden;overflow:clip}
.wrap{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding-block:clamp(84px,10vw,150px);padding-left:max(var(--gutter),calc(var(--side) + 20px));padding-right:var(--gutter-r)}
.sec-head{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.7fr);gap:16px 34px;align-items:end;margin-bottom:clamp(40px,5vw,72px)}
.sec-head .num{font-family:var(--f-display);font-size:clamp(70px,8vw,132px);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--gold);opacity:.75}
.sec-head h2{margin:12px 0 0;line-height:.9;font-weight:400}
.sec-head h2 .big{display:block;font-family:var(--f-display);text-transform:uppercase;font-size:clamp(46px,6vw,98px);letter-spacing:.005em}
.sec-head h2 .brush{display:block;font-size:clamp(38px,4.4vw,74px);margin:-.25em 0 0 .3em;transform:rotate(-5deg);transform-origin:left;line-height:1.15}
.sec-head .intro{margin:0;color:#CFC8BC;max-width:42ch;font-size:15px}
@media (max-width:860px){.sec-head{grid-template-columns:auto 1fr}.sec-head .intro{grid-column:1/-1}}
.ornament{position:absolute;pointer-events:none;inset:0;background:linear-gradient(118deg,transparent 0 62%,rgba(201,161,90,.05) 62% 62.3%,transparent 62.3% 70%,rgba(201,161,90,.04) 70% 70.2%,transparent 70.2%)}
.alt{background:linear-gradient(180deg,#121110,#0B0A09)}

/* career */
.career{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(30px,5vw,80px);align-items:start}
.tl{list-style:none;margin:0;padding:0 0 0 34px;position:relative}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--gold),rgba(201,161,90,.15))}
.tl li{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:4px 26px;padding:0 0 34px}
.tl li::before{content:"";position:absolute;left:-31px;top:10px;width:11px;height:11px;background:var(--onyx);border:1.5px solid var(--gold);transform:rotate(45deg)}
.tl li.now::before{background:var(--gold)}
.tl .yr{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--gold)}
.tl .yr small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;color:var(--smoke);margin-top:6px}
.tl h3{margin:0;font-family:var(--f-ui);font-weight:500;font-size:clamp(19px,1.6vw,23px);text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.tl .co{display:block;color:var(--gold);font-size:13px;letter-spacing:.06em;margin-top:2px}
.tl p{margin:8px 0 0;font-size:14px;color:#BEB6A9;max-width:60ch}
.career-photo{position:sticky;top:110px}
.career-photo .ph{aspect-ratio:3/4}
@media (max-width:900px){.career{grid-template-columns:1fr}.career-photo{position:static;max-width:420px}.tl li{grid-template-columns:1fr}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{padding:clamp(22px,2.4vw,34px);display:grid;gap:14px;align-content:start;min-height:210px}
.stat svg{width:34px;height:34px;color:var(--gold)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,4.8vw,78px);line-height:.9;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#D2CABD;line-height:1.5}
.stats-band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.62fr);gap:16px;margin-top:16px}
.stats-band .pic{position:relative;overflow:hidden;min-height:280px}
.stats-band .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.7);transition:filter .8s}
.stats-band .pic:hover img{filter:grayscale(0) brightness(.85)}
.stats-band .pic p{position:absolute;left:24px;bottom:20px;right:24px;margin:0;font-family:var(--f-brush);font-size:clamp(28px,2.6vw,40px);line-height:1.1}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats-band{grid-template-columns:1fr}}

/* expertise */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{padding:clamp(24px,2.6vw,36px);min-height:230px;display:flex;flex-direction:column;gap:14px;transition:transform .5s var(--ease),border-color .4s}
.card:hover{transform:translate3d(0,-6px,0);border-color:var(--gold)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card svg{width:36px;height:36px;color:var(--gold)}
.card .n{font-family:var(--f-display);font-size:28px;color:transparent;-webkit-text-stroke:1px var(--gold)}
.card h3{margin:auto 0 0;font-family:var(--f-ui);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:21px;line-height:1.2}
.card p{margin:0;font-size:14px;color:#BEB6A9}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}

/* work */
.reel{display:grid;grid-auto-flow:column;grid-auto-columns:min(80vw,440px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:18px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent;overscroll-behavior-x:contain}
.work-card{scroll-snap-align:start;text-decoration:none;color:inherit;display:block;padding:12px}
.work-card .media{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--steel)}
.work-card .media img,.work-card .media .ph{transition:transform .9s var(--ease)}
.work-card:hover .media img,.work-card:hover .media .ph{transform:scale(1.05)}
.work-meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:16px 6px 6px}
.work-meta h3{margin:0;font-family:var(--f-ui);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:20px}
.work-meta .label{color:var(--gold);font-size:11px}
.reel-nav{display:flex;gap:10px;justify-content:flex-end}
.reel-nav button{width:48px;height:48px;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;font-size:18px;transform:skewX(-14deg);transition:background .3s,color .3s}
.reel-nav button:hover{background:var(--gold);color:var(--onyx)}

/* media placeholder */
.media{overflow:hidden;background:var(--steel)}
.media img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:radial-gradient(110% 80% at 50% 30%,rgba(201,161,90,.16),transparent 60%),linear-gradient(160deg,#272420,#121110);color:var(--smoke)}
.ph svg{width:min(46%,190px);height:auto;opacity:.7}
.ph small{font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;max-width:30ch;line-height:1.6}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(150px,15vw,230px);grid-auto-flow:dense;gap:14px}
.gal{position:relative;margin:0;overflow:hidden;background:var(--steel);grid-row:span 2}
.gal.wide{grid-column:span 2;grid-row:span 2}
.gal .media{position:absolute;inset:0;background:transparent}
.gal .media img{filter:grayscale(1) brightness(.78) contrast(1.05);transition:filter .8s var(--ease),transform 1.1s var(--ease)}
.gal:hover .media img{filter:none;transform:scale(1.05)}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 14px;background:linear-gradient(transparent,rgba(10,9,8,.9));z-index:2;display:flex;justify-content:space-between;align-items:end;gap:10px}
.gal figcaption b{font-family:var(--f-ui);font-weight:500;font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.gal figcaption span{font-family:var(--f-ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.gal::after{content:"";position:absolute;inset:0;border:1px solid var(--line);pointer-events:none;z-index:3;transition:border-color .4s}
.gal:hover::after{border-color:var(--gold)}
.gal-add{grid-row:span 2;border:1.5px dashed var(--gold);background:transparent;color:var(--gold);font-family:var(--f-ui);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
@media (max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.gal.wide{grid-column:span 2}}

/* skills */
.skills{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,4vw,64px)}
.skills h3{margin:0 0 18px;font-family:var(--f-ui);font-weight:500;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.bar .nm{font-family:var(--f-ui);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.bar .track{height:6px;background:rgba(244,241,235,.08);transform:skewX(-20deg);overflow:hidden}
.bar .fill{height:100%;background:var(--goldgrad);transform:scaleX(0);transform-origin:left;transition:transform 1.5s var(--ease)}
.in .bar .fill{transform:scaleX(var(--p))}
.bar .pct{text-align:right;font-family:var(--f-display);font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.chip{padding:10px 18px;border:1px solid var(--line);font-family:var(--f-ui);font-size:13px;letter-spacing:.06em;text-transform:uppercase;transform:skewX(-14deg)}
.chip>span{display:inline-block;transform:skewX(14deg)}
.tools{display:grid;grid-template-columns:repeat(6,minmax(0,64px));gap:12px}
.tool{aspect-ratio:1;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:var(--gold);transition:background .3s,color .3s}
.tool:hover{background:var(--gold);color:var(--onyx)}
@media (max-width:900px){.skills{grid-template-columns:1fr}}

/* testimonials */
.quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.quote{margin:0;padding:clamp(26px,3vw,40px);display:grid;gap:18px}
.quote .qm{font-family:var(--f-display);font-size:64px;line-height:.6;color:var(--gold)}
.quote p{margin:0;font-size:clamp(17px,1.35vw,20px);line-height:1.55;color:#E7E1D6}
.quote b{display:block;font-family:var(--f-ui);font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.quote span{display:block;font-size:13px;color:var(--gold)}
@media (max-width:860px){.quotes{grid-template-columns:1fr}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(30px,5vw,80px);align-items:center}
.about .pic{position:relative;max-width:440px}
.about .pic img{width:100%;height:auto;filter:grayscale(.15)}
.about .pic::before{content:"";position:absolute;inset:16px -16px -16px 16px;border:1px solid var(--gold);z-index:-1}
.about .lead{font-size:clamp(17px,1.35vw,20px);line-height:1.7;margin:0;white-space:pre-line;color:#E7E1D6;max-width:56ch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:34px}
.fact{padding:18px 20px}
.fact .label{color:var(--gold);display:block;margin-bottom:6px;font-size:11px}
.fact b{font-weight:500;display:block}
.fact span{font-size:14px;color:#BEB6A9}
@media (max-width:900px){.about{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}

/* contact */
.contact{background:radial-gradient(60% 80% at 80% 60%,#2A2218,var(--onyx) 70%)}
.contact .slab{right:4%;top:10%;width:34%;height:80%;clip-path:polygon(22% 0,100% 0,78% 100%,0 100%);opacity:.7}
.contact h2{margin:16px 0 0;line-height:.86;font-weight:400;max-width:900px}
.contact h2 .big{display:block;font-family:var(--f-display);text-transform:uppercase;font-size:clamp(58px,9vw,150px)}
.contact h2 .brush{display:block;font-size:clamp(46px,6vw,104px);margin:-.3em 0 0 .4em;transform:rotate(-6deg);transform-origin:left;line-height:1.15}
.contact-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:clamp(40px,5vw,64px);max-width:900px}
.contact-row .item{padding:20px 22px}
.contact-row .label{color:var(--gold);display:block;margin-bottom:8px;font-size:11px}
.contact-row .v{font-size:16px;word-break:break-word}
.copy-btn{margin-top:10px;background:none;border:0;padding:0;color:var(--smoke);font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:underline}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:70px;padding-top:22px;border-top:1px solid var(--line-soft);color:var(--smoke);font-size:12px;letter-spacing:.06em}
@media (max-width:900px){.contact .slab{display:none}}


/* ---------- profile page: monochrome glass widgets ---------- */
.pf{position:relative;min-height:100svh;background:#0A0A0A;color:#EDEDED;overflow:hidden;overflow:clip;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gutter-r) calc(40px + env(safe-area-inset-bottom,0px)) var(--gutter)}
.pf-bg{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:.55;pointer-events:none}
.pf-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 40%,rgba(10,10,10,.2),rgba(10,10,10,.85))}
.pf-frame{position:relative;z-index:1;max-width:904px;margin:0 auto}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 40%),rgba(12,12,12,.86);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.45)}
.pf-nav{display:flex;align-items:center;gap:clamp(14px,4vw,52px);padding:16px 30px;border-radius:999px;margin:0 auto 52px;max-width:740px}
.pf-nav a,.pf-nav button{font-family:var(--f-ui);font-size:clamp(13px,1.6vw,17px);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#BDBDBD;background:none;border:0;cursor:pointer;padding:0}
.pf-nav a.on,.pf-nav a:hover{color:#fff}
.pf-nav .ham{width:26px;height:20px;position:relative;margin-right:auto}
.pf-nav .ham::before,.pf-nav .ham::after,.pf-nav .ham span{content:"";position:absolute;left:0;right:0;height:2.5px;background:#E6E6E6;border-radius:2px}
.pf-nav .ham::before{top:0}.pf-nav .ham span{top:8.5px}.pf-nav .ham::after{bottom:0}
.pf-nav .sp{margin-left:auto}
.pf-board{position:relative;container-type:inline-size}
.pf-head{border-radius:44px;display:grid;grid-template-columns:28% 1fr;gap:0 4%;padding:6% 5% 5% 4%}
.pf-me{display:grid;justify-items:center;align-content:start;gap:14px;text-align:center}
.pf-avatar{width:clamp(96px,14cqw,128px);aspect-ratio:1;border-radius:50%;padding:7px;background:linear-gradient(145deg,#5A5A5A,#141414);box-shadow:0 10px 24px rgba(0,0,0,.6)}
.pf-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;filter:grayscale(1) contrast(1.08)}
.pf-soc{display:flex;gap:18px}
.pf-soc a{width:30px;height:30px;display:grid;place-items:center;color:#E6E6E6;transition:color .3s,transform .3s}
.pf-soc a:hover{color:#fff;transform:translateY(-2px)}
.pf-soc svg{width:26px;height:26px}
.pf-me .nm{font-size:clamp(15px,1.9cqw,18px);color:#DADADA}
.pf-me .bell{display:grid;justify-items:center;gap:4px;font-size:clamp(14px,1.8cqw,17px);color:#DADADA;margin-top:10px}
.pf-me .bell svg{width:34px;height:34px;color:#D0D0D0;animation:ring 3.6s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
.pf-txt{align-self:center;position:relative;z-index:4}
.pf-txt h1{margin:0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(44px,9.4cqw,86px);line-height:.95;background:linear-gradient(180deg,#fff 0%,#D6D6D6 45%,#8C8C8C 55%,#E9E9E9 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pf-txt .role{font-size:clamp(17px,2.3cqw,22px);color:#F0F0F0;margin-top:10px;display:block}
.pf-txt p{margin:18px 0 0;font-size:clamp(14px,1.85cqw,17px);line-height:1.5;color:#C9C9C9;max-width:38ch}
.pf-tag{display:grid;place-items:center;border-radius:999px;text-transform:uppercase;font-family:var(--f-ui);font-weight:500;letter-spacing:.9em;padding-left:.9em;font-size:clamp(13px,1.9cqw,18px);color:#F2F2F2;z-index:5}
.pf-dots{display:flex;gap:14px;align-items:center;justify-content:center;z-index:5}
.pf-dots i{width:24px;height:24px;border-radius:50%;background:#D8D8D8;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35)}
.pf-photo{z-index:2;pointer-events:none}
.pf-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:grayscale(1) contrast(1.12) brightness(.95);transition:opacity .6s}
.pf-dock{z-index:3;border-radius:46px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 0}
.pf-ic{position:relative;width:52px;height:52px;display:grid;place-items:center;color:#E8E8E8;background:none;border:0;cursor:pointer;border-radius:14px;transition:background .3s,color .3s}
.pf-ic:hover,.pf-ic.on{background:rgba(255,255,255,.1);color:#fff}
.pf-ic svg{width:36px;height:36px}
.pf-ic .tip{position:absolute;left:calc(100% + 12px);top:50%;transform:translate(-6px,-50%);white-space:nowrap;background:#F2F2F2;color:#0A0A0A;font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:6}
.pf-ic:hover .tip,.pf-ic:focus-visible .tip{opacity:1;transform:translate(0,-50%)}
.pf-ic .aa{font-family:var(--f-body);font-size:30px;font-weight:500}
.pf-slider{z-index:3;border-radius:30px;display:flex;flex-direction:column;align-items:center;padding:14px 0 18px;gap:12px;cursor:pointer;border:1px solid rgba(255,255,255,.14)}
.pf-slider b{font-family:var(--f-body);font-weight:500;font-size:14px;color:#E6E6E6;font-variant-numeric:tabular-nums}
.pf-slider .tr{flex:1;width:16px;border-radius:999px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.pf-slider .fl{position:absolute;left:0;right:0;bottom:0;height:100%;border-radius:999px;background:linear-gradient(#FFFFFF,#9A9A9A);transform-origin:bottom;transform:scaleY(var(--v,.95));transition:transform .8s var(--ease)}
.pf-slider small{font-family:var(--f-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#BDBDBD;writing-mode:vertical-rl;transform:rotate(180deg)}
.pf-status{z-index:3;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:14px;color:#F2F2F2}
.pf-status svg{height:26px;width:auto}
.pf-status em{font-style:normal;font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#CFCFCF}
.pf-status .dot{width:8px;height:8px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 10px #7CFFB2;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.pf-weather{z-index:3;border-radius:30px;background:linear-gradient(160deg,#F2F2F2,#9C9C9C);color:#1A1A1A;display:grid;place-items:center;align-content:center;gap:2px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 16px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4)}
.pf-weather svg{width:56%;height:auto;color:#2A2A2A}
.pf-weather b{font-family:var(--f-ui);font-weight:500;font-size:clamp(16px,2.2cqw,20px);line-height:1;font-variant-numeric:tabular-nums}
.pf-weather small{font-family:var(--f-ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#3A3A3A}
.pf-ctrl{z-index:3;border-radius:34px;padding:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr auto;gap:12px;place-items:center}
.pf-tg{width:100%;aspect-ratio:1;max-width:68px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:linear-gradient(160deg,#3A3A3A,#1C1C1C);color:#EDEDED;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.5);transition:background .35s,color .35s,transform .25s}
.pf-tg:active{transform:scale(.94)}
.pf-tg.on{background:linear-gradient(160deg,#FFFFFF,#BDBDBD);color:#111}
.pf-tg svg{width:46%;height:46%}
.pf-ctrl .read{grid-column:1/-1;font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#DADADA;text-align:center;line-height:1.3;min-height:2.6em}
.pf-ctrl .read b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.02em;color:#fff}
.pf-rdock{z-index:3;border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0}
.pf-rdock a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#EDEDED;text-decoration:none;transition:background .3s,color .3s}
.pf-rdock a:hover{background:rgba(255,255,255,.12)}

  els.forEach(function(e){io.observe(e)});
  var order=S.sections.filter(function(s){return s.visible!==false||editing}).map(function(s){return s.id});
  sio=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;var id=en.target.id;
    app.querySelectorAll("[data-link]").forEach(function(a){a.classList.toggle("on",a.dataset.link===id)});

    bar.innerHTML='<button type="button" data-up>Replace image</button>'+(S.img[key]&&DEF[key]?'<button type="button" data-rm>Reset</button>':"");
    if(getComputedStyle(host).position==="static")host.style.position="relative";host.append(bar);

  });

var picker=null;
function pickImage(key,before){
  if(!picker){picker=document.createElement("input");picker.type="file";picker.accept="image/*";picker.id="img-picker";picker.hidden=true;document.body.append(picker)}
  picker.value="";
  picker.onchange=function(){var f=picker.files&&picker.files[0];if(!f)return;toast("Preparing image…");
    shrink(f,2000).then(function(blob){var up=assetsNS?assetsNS.upload(blob).then(function(r){return r.url}).catch(function(){return null}):Promise.resolve(null);return up.then(function(url){return url||shrink(f,1400).then(toDataURL)})})
    .then(function(url){collect();S.img[key]=url;if(before)before();render();toast("Image placed. Save & publish to make it live.")}).catch(function(){toast("That file couldn't be read as an image. Try a JPG or PNG.")})};
  picker.click();

function save(){
  if(editing)collect();
  var dr=document.querySelector(".drawer"),nu=dr&&dr.querySelector("#adm-user")?dr.querySelector("#adm-user").value.trim():S.auth.user,np=dr&&dr.querySelector("#adm-pass")?dr.querySelector("#adm-pass").value:"",step=Promise.resolve();
  if(np||nu!==S.auth.user){if(!np){toast("Enter a new password to change the login ID.");return}if(np.length<8){toast("Use a password of at least 8 characters.");return}step=sha(nu+":"+np).then(function(h){if(h)S.auth={user:nu,hash:h}})}
  step.then(function(){var go=artifactNS?Promise.resolve(artifactNS):(window.claude&&claude.use?claude.use("artifact"):Promise.resolve(null));
    return go.then(function(a){if(!a){try{var bl=new Blob([buildDoc()],{type:"text/html"}),ln=document.createElement("a");ln.href=URL.createObjectURL(bl);ln.download="index.html";document.body.appendChild(ln);ln.click();setTimeout(function(){URL.revokeObjectURL(ln.href);ln.remove()},1500);SAVED=JSON.parse(JSON.stringify(S));toast("Downloaded index.html. Upload it to your host, replacing the old one, to make changes live.")}catch(e){toast("Couldn't create the file in this browser.")}return}toast("Publishing…");
